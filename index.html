<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Caderno de estudos sobre design social, arquitetura hostil e direito à cidade.">
<title>♱ A hostilidade da cidade ♱</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=UnifrakturCook:wght@700&display=swap" rel="stylesheet">
<style>

:root{
  --cor1: #c4bfac;  /* bege claro - texto principal */
  --cor2: #a49c88;  /* bege apagado - texto secundário */
  --cor3: #271118;  /* vinho escuro - fundo */
  --cor4: #170a0e;  /* vinho bem escuro - fundo profundo */
  --cor5: #1e0f14;  /* vinho médio - fundo das caixas */
  --cor6: #68525c;  /* mauve - destaque */
  --cor7: #9a7e88;  /* mauve claro - detalhes */
  --cor8: #ded7c4;  /* osso - títulos */
  --cor9: #4a3038;  /* linha/borda */
  --fonte-titulo: "UnifrakturCook", "Old English Text MT", serif;
  --fonte-texto: "Times New Roman", Times, serif;
  --raio: 2px;
  --espaco: 1.5rem;
}

*{ box-sizing:border-box; }
html{ scroll-behavior:smooth; }

body{
  margin:0;
  color: var(--cor1);
  font-family: var(--fonte-texto);
  font-size: 17px;
  line-height: 1.75;
  background:
	radial-gradient(ellipse at 50% 0%, rgba(104,82,92,0.18), transparent 60%),
	radial-gradient(ellipse at 50% 100%, rgba(0,0,0,0.5), transparent 70%),
	var(--cor4);
  background-attachment: fixed;
  min-height:100vh;
}

/* granulado sutil + vinheta por cima de tudo */
body::before{
  content:""; position:fixed; inset:0; pointer-events:none; z-index:50;
  background:
	repeating-linear-gradient(0deg, rgba(0,0,0,0.10) 0 1px, transparent 1px 3px),
	radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,0.55)
